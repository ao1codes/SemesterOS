openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: semester
    description: Semester planning data
  - name: syllabi
    description: Syllabus extraction and grounded answers
  - name: notifications
    description: Notification delivery configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /semester-state:
    get:
      operationId: getSemesterState
      tags: [semester]
      summary: Get the signed-in student's semester state
      responses:
        "200":
          description: Semester state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemesterState"
        "401":
          description: Authentication required
    put:
      operationId: saveSemesterState
      tags: [semester]
      summary: Save the signed-in student's semester state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemesterStateInput"
      responses:
        "200":
          description: Saved semester state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemesterState"
        "400":
          description: Invalid semester state
        "401":
          description: Authentication required
        "409":
          description: Semester changed elsewhere; reload before retrying
    delete:
      operationId: deleteSemesterState
      tags: [semester]
      summary: Delete the signed-in student's saved semester
      responses:
        "204":
          description: Saved semester data deleted
        "401":
          description: Authentication required
  /account:
    delete:
      operationId: deleteAccount
      summary: Delete the authenticated account and associated SemesterOS data
      responses:
        "204":
          description: Account deleted
        "401":
          description: Authentication required
  /notifications/delivery-status:
    get:
      operationId: getNotificationDeliveryStatus
      tags: [notifications]
      summary: Get available notification delivery channels
      responses:
        "200":
          description: Delivery configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryStatus"
        "401":
          description: Authentication required
  /syllabi/extract:
    post:
      operationId: extractSyllabus
      tags: [syllabi]
      summary: Extract reviewable course data from PDF text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyllabusTextInput"
      responses:
        "200":
          description: Extracted data for student review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusExtraction"
        "400":
          description: Invalid syllabus text
        "401":
          description: Authentication required
        "503":
          description: Gemini is not configured
  /syllabi/answer:
    post:
      operationId: askSyllabi
      tags: [syllabi]
      summary: Answer a question from the student's saved syllabus data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyllabusQuestionInput"
      responses:
        "200":
          description: Grounded answer and sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusAnswer"
        "400":
          description: Invalid question
        "401":
          description: Authentication required
        "503":
          description: Gemini is not configured
  /assignments/milestone-suggestions:
    post:
      operationId: suggestAssignmentMilestones
      tags: [syllabi]
      summary: Suggest reviewable milestones for an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneSuggestionInput"
      responses:
        "200":
          description: Suggested milestones for student review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneSuggestionResponse"
        "400":
          description: Invalid assignment details
        "401":
          description: Authentication required
        "503":
          description: Gemini is not configured
  /calendar/google/status:
    get:
      operationId: getGoogleCalendarStatus
      tags: [calendar]
      summary: Check whether Google Calendar is available to this account
      responses:
        "200":
          description: Integration availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarStatus"
        "401":
          description: Authentication required
  /calendar/google/calendars:
    get:
      operationId: listGoogleCalendars
      tags: [calendar]
      summary: List calendars available to the authorized account
      responses:
        "200":
          description: Available calendars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoogleCalendar"
        "401":
          description: Authentication required
        "403":
          description: Google Calendar is not enabled for this account
  /calendar/google/events:
    get:
      operationId: listGoogleBusyEvents
      tags: [calendar]
      summary: Read busy events in a selected calendar date range
      parameters:
        - in: query
          name: calendarId
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - in: query
          name: startDate
          required: true
          schema: { type: string, format: date }
        - in: query
          name: endDate
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Busy events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoogleBusyEvent"
        "400":
          description: Invalid date range
        "401":
          description: Authentication required
        "403":
          description: Google Calendar is not enabled for this account
  /calendar/google/export:
    post:
      operationId: exportSemesterEventsToGoogle
      tags: [calendar]
      summary: Create approved SemesterOS events in Google Calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCalendarExportInput"
      responses:
        "200":
          description: Export results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarExportResult"
        "400":
          description: Invalid event selection
        "401":
          description: Authentication required
        "403":
          description: Google Calendar is not enabled for this account
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Course:
      type: object
      required: [id, name, code, color, semesterStart, semesterEnd]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        instructor: { type: ["string", "null"] }
        color: { type: string }
        description: { type: ["string", "null"] }
        targetFinalGrade: { type: ["number", "null"], minimum: 0, maximum: 100 }
        gradingMode: { type: string, enum: [assignment_weighted, points_based, category_weighted] }
        gradeCategories:
          type: array
          items: { $ref: "#/components/schemas/GradeCategory" }
        semesterStart: { type: string, format: date }
        semesterEnd: { type: string, format: date }
    GradeCategory:
      type: object
      required: [id, name, weight]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        weight: { type: number, minimum: 0, maximum: 100 }
    AssignmentMilestone:
      type: object
      required: [id, title, completed]
      properties:
        id: { type: string }
        title: { type: string }
        completed: { type: boolean }
    Assignment:
      type: object
      required: [id, courseId, title, type, status, milestones]
      properties:
        id: { type: string }
        courseId: { type: string }
        title: { type: string }
        type:
          type: string
          enum: [exam, quiz, project, paper, homework, presentation, other]
        dueDate: { type: ["string", "null"], format: date }
        dueTime: { type: ["string", "null"] }
        gradeWeight: { type: ["number", "null"], minimum: 0, maximum: 100 }
        estimatedHours: { type: ["number", "null"], minimum: 0 }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [upcoming, in_progress, completed] }
        gradeEarned: { type: ["number", "null"], minimum: 0, maximum: 100 }
        gradeCategoryId: { type: ["string", "null"] }
        pointsEarned: { type: ["number", "null"], minimum: 0 }
        pointsPossible: { type: ["number", "null"], minimum: 0 }
        sourceDocumentId: { type: ["string", "null"] }
        sourcePage: { type: ["integer", "null"], minimum: 1 }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/AssignmentMilestone" }
    PolicyNote:
      type: object
      required: [id, topic, text]
      properties:
        id: { type: string }
        topic: { type: string }
        text: { type: string }
        page: { type: ["integer", "null"], minimum: 1 }
    SyllabusDocument:
      type: object
      required: [id, filename, uploadedAt, version, policyNotes]
      properties:
        id: { type: string }
        courseId: { type: ["string", "null"] }
        filename: { type: string }
        uploadedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        policyNotes:
          type: array
          items: { $ref: "#/components/schemas/PolicyNote" }
        snapshot: { $ref: "#/components/schemas/SyllabusSnapshot" }
    StudySession:
      type: object
      required: [id, title, date, startTime, durationMinutes, status]
      properties:
        id: { type: string }
        assignmentId: { type: ["string", "null"] }
        title: { type: string }
        date: { type: string, format: date }
        startTime: { type: string }
        durationMinutes: { type: integer, minimum: 5 }
        status: { type: string, enum: [planned, completed, partial, skipped, busy] }
        completedMinutes: { type: ["integer", "null"], minimum: 0 }
        calendarEventId: { type: ["string", "null"] }
    Notification:
      type: object
      required: [id, category, title, message, createdAt, isRead, dismissed]
      properties:
        id: { type: string }
        category:
          type: string
          enum: [deadline, exam, study_session, workload, conflict, missed_session, syllabus, progress]
        title: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        isRead: { type: boolean }
        dismissed: { type: boolean }
        snoozedUntil: { type: ["string", "null"], format: date-time }
    NotificationDeliveryStatus:
      type: object
      required: [emailConfigured, pushConfigured]
      properties:
        emailConfigured: { type: boolean }
        pushConfigured: { type: boolean }
    Preferences:
      type: object
      required:
        - timezone
        - semesterStart
        - semesterEnd
        - availableDays
        - availabilityStart
        - availabilityEnd
        - preferredTime
        - sessionDurationMinutes
        - breakMinutes
        - dailyStudyLimit
        - reminderHours
        - quietHoursStart
        - quietHoursEnd
      properties:
        timezone: { type: string }
        semesterStart: { type: string, format: date }
        semesterEnd: { type: string, format: date }
        availableDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        availabilityStart: { type: string }
        availabilityEnd: { type: string }
        preferredTime: { type: string, enum: [morning, afternoon, evening] }
        sessionDurationMinutes: { type: integer, minimum: 15, maximum: 180 }
        breakMinutes: { type: integer, minimum: 0, maximum: 60 }
        dailyStudyLimit: { type: integer, minimum: 1, maximum: 12 }
        reminderHours:
          type: array
          items: { type: integer, minimum: 0, maximum: 720 }
        notificationCategories:
          type: array
          items:
            type: string
            enum: [deadline, exam, study_session, workload, conflict, missed_session, syllabus, progress]
        quietHoursStart: { type: string }
        quietHoursEnd: { type: string }
        pushEnabled: { type: boolean }
        emailEnabled: { type: boolean }
    SemesterState:
      type: object
      required: [courses, assignments, sessions, notifications, documents, preferences]
      properties:
        revision:
          type: string
          description: Server revision required when replacing saved state; stale writes return 409
        courses:
          type: array
          items: { $ref: "#/components/schemas/Course" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/StudySession" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/SyllabusDocument" }
        preferences: { $ref: "#/components/schemas/Preferences" }
    SemesterStateInput:
      allOf:
        - $ref: "#/components/schemas/SemesterState"
    SyllabusTextInput:
      type: object
      required: [filename, pdfBase64]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        pdfBase64: { type: string, minLength: 100, maxLength: 14000000 }
        existingCourseId: { type: string }
    SyllabusExtraction:
      type: object
      required: [course, assignments, policyNotes, ambiguities]
      properties:
        course:
          type: object
          required: [name, code]
          properties:
            name: { type: string }
            code: { type: string }
            instructor: { type: ["string", "null"] }
            description: { type: ["string", "null"] }
            semesterStart: { type: ["string", "null"], format: date }
            semesterEnd: { type: ["string", "null"], format: date }
        assignments:
          type: array
          items:
            type: object
            required: [title, type]
            properties:
              title: { type: string }
              type: { type: string, enum: [exam, quiz, project, paper, homework, presentation, other] }
              dueDate: { type: ["string", "null"], format: date }
              dueTime: { type: ["string", "null"] }
              gradeWeight: { type: ["number", "null"], minimum: 0, maximum: 100 }
              estimatedHours: { type: ["number", "null"], minimum: 0 }
              description: { type: ["string", "null"] }
              sourcePage: { type: ["integer", "null"], minimum: 1 }
        policyNotes:
          type: array
          items:
            type: object
            required: [topic, text]
            properties:
              topic: { type: string }
              text: { type: string }
              page: { type: ["integer", "null"], minimum: 1 }
        ambiguities:
          type: array
          items: { type: string }
    SyllabusSnapshot:
      type: object
      required: [course, assignments, policyNotes, ambiguities]
      properties:
        course: { $ref: "#/components/schemas/Course" }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
        policyNotes:
          type: array
          items: { $ref: "#/components/schemas/PolicyNote" }
        ambiguities:
          type: array
          items: { type: string }
    GoogleCalendarStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        message: { type: ["string", "null"] }
    GoogleCalendar:
      type: object
      required: [id, summary, primary, timeZone]
      properties:
        id: { type: string }
        summary: { type: string }
        primary: { type: boolean }
        timeZone: { type: ["string", "null"] }
    GoogleBusyEvent:
      type: object
      required: [id, summary, start, end, allDay]
      properties:
        id: { type: string }
        summary: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        allDay: { type: boolean }
    GoogleCalendarExportInput:
      type: object
      required: [calendarId, eventIds]
      properties:
        updateExisting: { type: boolean, description: Explicit approval to update previously exported events owned by this account }
        calendarId: { type: string, minLength: 1, maxLength: 255 }
        eventIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255 }
    GoogleCalendarExportResult:
      type: object
      required: [created, skipped]
      properties:
        updated: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        messages:
          type: array
          items: { type: string }
    SyllabusQuestionInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 1200 }
    AnswerSource:
      type: object
      required: [label, page]
      properties:
        label: { type: string }
        page: { type: ["integer", "null"], minimum: 1 }
    SyllabusAnswer:
      type: object
      required: [answer, sources]
      properties:
        answer: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/AnswerSource" }
    MilestoneSuggestionInput:
      type: object
      required: [assignmentTitle, type]
      properties:
        assignmentTitle: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [exam, quiz, project, paper, homework, presentation, other] }
        description: { type: ["string", "null"], maxLength: 2000 }
    MilestoneSuggestionResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 120 }

